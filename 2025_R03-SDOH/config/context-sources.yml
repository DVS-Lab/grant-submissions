version: 1
participant_linkage:
  primary: current_five_digit_zip
  crosswalk: uds_mapper_2022_zip_to_zcta
  private_fields_excluded_from_analysis_master: [current_zip, childhood_zip, current_zcta, childhood_zcta]
sources:
  zip_zcta:
    organization: HRSA UDS Mapper
    release: "2022 archived crosswalk"
    geography: ZIP_to_ZCTA
    url: https://raw.githubusercontent.com/chris-prener/uds-mapper/main/data/uds_crosswalk_2022.csv
  sdi:
    organization: Robert Graham Center
    release: "ACS 2015-2019"
    geography: ZCTA
    variable: SDI_score
    direction: higher_is_more_deprivation
    role: primary
  pm25:
    organization: Washington University ACAG
    product: V5.NA.05_HybridPM25_NorthAmerica
    years: [2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022]
    source_geography: 0.01_degree_grid
    target_geography: Census_2020_ZCTA_500k
    aggregation: latitude_corrected_area_weighted_polygon_intersection
    units: micrograms_per_cubic_meter
    role: primary
  social_capital:
    organization: Opportunity Insights
    release: "2022"
    geography: ZIP
    primary_variable: ec_zip
    selected_secondary_variables: [exposure_grp_mem_zip, bias_grp_mem_zip, clustering_zip, support_ratio_zip, volunteering_rate_zip, civic_organizations_zip]
  gini:
    organization: U.S. Census Bureau via Census Reporter
    product: ACS_2024_5_year
    table: B19083
    estimate: B19083001
    geography: ZCTA
    role: primary
  ruca:
    organization: USDA Economic Research Service
    release: "2020 codes; 2025 ZIP release"
    geography: ZIP
    role: primary
unavailable:
  adi_zcta_proxy:
    status: not_generated
    reason: credentialed_block_group_data_and_defensible_population_weights_required
  crime_disorder:
    status: source_audit_only
    reason: no_consistent_national_contemporary_ZIP_or_ZCTA_product
